name: TikTok Live Check

on:
  schedule:
    # Automātiski palaiž botu ik pēc 10 minūtēm
    - cron: '*/10 * * * *'
  workflow_dispatch: # Saglabā pogu, lai vari palaist arī manuāli, kad vēlies

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests TikTokLive

      - name: Run TikTok Bot
        env:
          # Šis droši paņem tavu iestatīto Discord saiti no Secrets
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
