name: TikTok Live Check

on:
  schedule:
    # Pārbauda ik pēc 10 minūtēm
    - cron: '*/10 * * * *'

  # Ļauj palaist manuāli
  workflow_dispatch:

jobs:
  check-live:
    runs-on: ubuntu-latest

    # Vajadzīgs, lai Actions varētu saglabāt
    # live_status.json atpakaļ GitHub repozitorijā
    permissions:
      contents: write

    steps:

      # ======================================================
      # IEGŪST REPozitorija failus
      # ======================================================
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ======================================================
      # INSTALĒ BIBLIOTĒKAS
      # ======================================================
      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # PALAIŽ BOTU
      # ======================================================
      - name: Run TikTok Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      # ======================================================
      # SAGLABĀ LIVE STATUSU
      # ======================================================
      - name: Save live status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_status.json

          if git diff --cached --quiet; then
            echo "ℹ️ live_status.json nav mainīts."
          else
            git commit -m "Update TikTok live status"
            git push
            echo "✅ live_status.json saglabāts GitHub."
          fi
